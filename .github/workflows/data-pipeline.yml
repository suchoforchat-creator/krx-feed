name: data-pipeline

on:
  schedule:
    # Monday-Friday 07:30 KST (22:30 UTC, previous day)
    - cron: '30 22 * * 0-4'
    - cron: '00 08 * * 1-5'
  workflow_dispatch:
    inputs:
      phase:
        description: '0730 snapshot + previous-close catch-up, 1700 completed session, or strict recovery'
        type: choice
        options: ['0730', '1700', 'recovery']
        default: '0730'
        required: true
      expected_target_date:
        description: 'Expected latest completed KRX session YYYY-MM-DD (required for recovery)'
        type: string
        default: ''
      expected_observation_date:
        description: 'Expected actual KST observation date YYYY-MM-DD (required for recovery)'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false
  
env:
  KRX_ID: ${{ secrets.KRX_ID }}
  KRX_PW: ${{ secrets.KRX_PW }}
  
jobs:
  collect_0730:
    if: github.event.schedule == '30 22 * * 0-4' || (github.event_name == 'workflow_dispatch' && inputs.phase == '0730')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - run: git pull --rebase origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - name: Offline regression before collection
        run: python -B -m pytest -q -p no:cacheprovider
      - run: python pipeline.py --phase 0730 --tz Asia/Seoul --expected-target-date "$EXPECTED_TARGET_DATE" --expected-observation-date "$EXPECTED_OBSERVATION_DATE"
        env:
          EXPECTED_TARGET_DATE: ${{ inputs.expected_target_date }}
          EXPECTED_OBSERVATION_DATE: ${{ inputs.expected_observation_date }}
      - name: Upload snapshot and previous-close diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collection-debug-0730
          path: |
            debug/0730/*.json
            out/latest.csv
            out/history.csv
          if-no-files-found: ignore
      - run: |
          git config user.name 'bot'
          git config user.email 'bot@users.noreply.github.com'
          git add -A out/
          git diff --cached --quiet || git commit -m "0730 snapshot $(date -u +%F)"
          git push

  finalize_1700:
    if: github.event.schedule == '00 08 * * 1-5' || (github.event_name == 'workflow_dispatch' && (inputs.phase == '1700' || inputs.phase == 'recovery'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - run: git pull --rebase origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - name: Offline regression before collection
        run: python -B -m pytest -q -p no:cacheprovider
      - run: python pipeline.py --phase "$REQUESTED_PHASE" --tz Asia/Seoul --reconcile --expected-target-date "$EXPECTED_TARGET_DATE" --expected-observation-date "$EXPECTED_OBSERVATION_DATE"
        env:
          REQUESTED_PHASE: ${{ inputs.phase || '1700' }}
          EXPECTED_TARGET_DATE: ${{ inputs.expected_target_date }}
          EXPECTED_OBSERVATION_DATE: ${{ inputs.expected_observation_date }}
      - run: |
          git config user.name 'bot'
          git config user.email 'bot@users.noreply.github.com'
          # 디버깅 편의를 위해 out/ 폴더 전체를 스테이징하면 history.csv 누락을 쉽게 방지할 수 있습니다.
          git add -A out/
          git diff --cached --quiet || git commit -m "1700 final $(date -u +%F)"
          git push
      - name: Upload history debug
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-debug-1700
          path: |
            debug/1700/*.json
            debug/recovery/*.json
            out/latest.csv
            out/history.csv
          if-no-files-found: ignore
